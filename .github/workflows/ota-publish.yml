name: OTA Publish

# Ships a web-only update to installed apps without an App Store review.
# Native changes (plugins, permissions, icons) still require a TestFlight build.
#
# The bundle version must be greater than the shipped native version
# (iOS MARKETING_VERSION / Android versionName) or devices ignore it.
#
# Required secrets: OTA_PUBLISH_TOKEN (must match the backend's env var).

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Update channel'
        required: true
        type: choice
        options: [testflight, production]
      version:
        description: 'Bundle version (semver, defaults to package.json version)'
        required: false
        type: string

concurrency:
  group: ota-publish-${{ github.event.inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.inputs.channel }} bundle
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.channel == 'production' && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vite build
        run: npx vite build --mode ${{ github.event.inputs.channel == 'production' && 'production' || 'testflight' }}
        env:
          CAPACITOR: '1'

      - name: Publish bundle
        run: node scripts/publish-ota.mjs --channel ${{ github.event.inputs.channel }} ${{ github.event.inputs.version && format('--version {0}', github.event.inputs.version) || '' }}
        env:
          OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
