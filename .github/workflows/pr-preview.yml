name: PR Preview Environment

# Build Docker image and deploy preview container using Proxmox Launchpad.
# Pattern mirrors the working FHIRTogether workflow — uses mieweb/launchpad@main
# directly instead of lower-level sub-actions.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  REGISTRY: ghcr.io

jobs:
  # ── Post an immediate "building" comment so devs know the pipeline started ──
  notify-building:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- preview-url-comment -->';
            const body = `${marker}
            ## ⏳ Preview Build In Progress

            Docker image is building — this takes a few minutes (Meteor bundle compilation happens at image-build time, not container start time).

            A new comment will appear here when the preview is ready or if the build fails.
            `;
            const { owner, repo } = context.repo;
            const issue_number = parseInt(process.env.PR_NUMBER);
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # ── Build and push Docker image to GHCR ──────────────────────────────────
  build-and-push:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      # Digest-pinned reference to the exact image this run built. The
      # :pr-<n> tag is mutable — a later push to the same PR overwrites it —
      # so anything that must match this run's checkout (e2e) uses this.
      image_ref: ${{ steps.image-ref.outputs.ref }}
      container_name: ${{ steps.container.outputs.name }}
      # A fork PR's GITHUB_TOKEN is read-only whatever `permissions` asks for,
      # so its image can't go to GHCR. It is built anyway and handed to the
      # e2e shards as a workflow artifact instead. (Dependabot PRs come from
      # this repo and do get packages: write, so they push like any other.)
      is_fork: ${{ steps.trust.outputs.is_fork }}
    steps:
      - id: trust
        name: Detect fork PR
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" = "${{ github.repository }}" ]; then
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          # Only init meteor-wormhole — @mieweb/ui is installed from npm, no
          # submodule needed for it.
          submodules: false

      - name: Init meteor-wormhole submodule
        run: git submodule update --init vendor/meteor-wormhole

      - id: container
        name: Compute container name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          REPO_NAME=$(basename "${{ github.repository }}")
          CONTAINER_NAME="${{ github.repository_owner }}-${REPO_NAME}-${HEAD_REF}"
          CONTAINER_NAME=${CONTAINER_NAME,,}
          CONTAINER_NAME=$(echo "$CONTAINER_NAME" | sed 's/[^a-z0-9-]/-/g')
          # Launchpad enforces a 63-character hostname limit, and the API
          # service reuses this name with a "-api" suffix — so truncate to
          # leave room for it, and drop any trailing hyphen left by the cut.
          CONTAINER_NAME=$(echo "$CONTAINER_NAME" | cut -c1-59 | sed 's/-*$//')
          echo "name=${CONTAINER_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.trust.outputs.is_fork == 'false'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: |
          echo "tag=${{ env.REGISTRY }}/${{ github.repository_owner }}/timehuddle:pr-${{ github.event.pull_request.number }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ steps.trust.outputs.is_fork == 'false' }}
          # Fork PRs: write the image to a tarball for the e2e artifact below.
          outputs: ${{ steps.trust.outputs.is_fork == 'true' && format('type=docker,dest={0}/e2e-image.tar', runner.temp) || '' }}
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            VITE_TIMECORE_URL=https://${{ steps.container.outputs.name }}-api.os.mieweb.org
            # PR-preview only — never set true for a production or TestFlight build,
            # it turns on one-click sign-in as any role, including org/enterprise owner.
            VITE_DEV_QUICK_LOGIN=true
            DEV_QUICK_LOGIN_ENABLED=true
          # Aggressive layer cache — Meteor package installs are the slow part
          cache-from: type=registry,ref=${{ steps.image.outputs.tag }}-cache
          cache-to: ${{ steps.trust.outputs.is_fork == 'false' && format('type=registry,ref={0}-cache,mode=max', steps.image.outputs.tag) || '' }}

      - id: image-ref
        name: Compute digest-pinned image reference
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IS_FORK: ${{ steps.trust.outputs.is_fork }}
        run: |
          # A fork's image never leaves this run, so its tag can't be
          # overwritten by a later push — the tag the tarball loads under is
          # already exact.
          if [ "$IS_FORK" = "true" ]; then
            echo "ref=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$DIGEST" ]; then
            echo "::error::docker/build-push-action reported no digest."
            exit 1
          fi
          echo "ref=${IMAGE_TAG%:*}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Upload image for e2e (fork PRs)
        if: steps.trust.outputs.is_fork == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-image
          path: ${{ runner.temp }}/e2e-image.tar
          retention-days: 1

      # Launchpad pulls images anonymously — the package must be public.
      # Requires GHCR_ADMIN_TOKEN secret: a PAT from an org admin with write:packages scope.
      # One-time manual fallback: https://github.com/orgs/mieweb/packages/container/timehuddle/settings
      - name: Make GHCR image public (Launchpad requires anonymous pull)
        if: steps.trust.outputs.is_fork == 'false'
        env:
          GHCR_ADMIN_TOKEN: ${{ secrets.GHCR_ADMIN_TOKEN }}
        run: |
          if [ -z "$GHCR_ADMIN_TOKEN" ]; then
            echo "::warning::GHCR_ADMIN_TOKEN secret not set — skipping auto-visibility. Ensure ghcr.io/mieweb/timehuddle is manually set to public."
            exit 0
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X PATCH "https://api.github.com/orgs/mieweb/packages/container/timehuddle" \
            -H "Authorization: Bearer $GHCR_ADMIN_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"visibility":"public"}')
          CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$CODE" = "200" ]; then
            echo "✅ Package visibility set to public (HTTP $CODE)"
          else
            echo "::warning::Could not set package visibility: HTTP $CODE — $BODY"
            echo "Ensure ghcr.io/mieweb/timehuddle is manually set to public."
          fi

  # ── E2E tests against the PR image, one shard per runner ───────────────────
  # Reuses the image build-and-push just pushed (Mongo + prebuilt Meteor
  # bundle), so the backend under test always matches this PR's code and no
  # second build is needed. All the wiring lives in the script, which runs the
  # same way locally on Linux — see tests/e2e-container-shard.sh.
  e2e:
    if: github.event.action != 'closed'
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    concurrency:
      group: e2e-${{ github.event.pull_request.number }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # The shard count is the length of this list; --shard below reads it
        # back via strategy.job-total, so this is the only place to change it.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - uses: docker/login-action@v3
        if: needs.build-and-push.outputs.is_fork == 'false'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image (fork PRs)
        if: needs.build-and-push.outputs.is_fork == 'true'
        uses: actions/download-artifact@v4
        with:
          name: e2e-image
          path: ${{ runner.temp }}

      - name: Load image (fork PRs)
        if: needs.build-and-push.outputs.is_fork == 'true'
        run: docker load --input "${{ runner.temp }}/e2e-image.tar"

      - name: Run e2e shard ${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ github.workspace }}/blob-report
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
        run: >-
          tests/e2e-container-shard.sh "$IMAGE_REF"
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=list,blob

      - name: Upload shard blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

  # ── Merge the shard reports into one HTML report ───────────────────────────
  e2e-report:
    if: ${{ !cancelled() && github.event.action != 'closed' }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge shard reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Deploy preview container via the container API ─────────────────────────
  # Skipped for fork PRs: their image is never pushed for Launchpad to pull,
  # and the Launchpad secrets aren't available to them anyway.
  deploy-preview:
    if: github.event.action != 'closed' && needs.build-and-push.outputs.is_fork == 'false'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - id: preview
        name: Compute preview URLs
        run: |
          CONTAINER_NAME="${{ needs.build-and-push.outputs.container_name }}"
          echo "container_name=${CONTAINER_NAME}" >> "$GITHUB_OUTPUT"
          echo "url=https://${CONTAINER_NAME}.os.mieweb.org" >> "$GITHUB_OUTPUT"
          echo "api_url=https://${CONTAINER_NAME}-api.os.mieweb.org" >> "$GITHUB_OUTPUT"

      - id: locate
        name: Locate existing preview container
        uses: mieweb/opensource-server/.github/actions/get-container@main
        with:
          api_key: ${{ secrets.LAUNCHPAD_API_KEY }}
          api_url: ${{ secrets.LAUNCHPAD_API_URL }}
          hostname: ${{ steps.preview.outputs.container_name }}

      - name: Delete existing preview container
        if: steps.locate.outputs.found == 'true'
        env:
          API_KEY: ${{ secrets.LAUNCHPAD_API_KEY }}
          API_URL: ${{ secrets.LAUNCHPAD_API_URL }}
          CONTAINER_HOSTNAME: ${{ steps.preview.outputs.container_name }}
          CONTAINER_ID: ${{ steps.locate.outputs.container_id }}
          SITE_ID: 1
        run: |
          set -euo pipefail

          DELETE_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X DELETE "$API_URL/api/v1/sites/$SITE_ID/containers/$CONTAINER_ID" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Accept: application/json")

          DELETE_CODE=$(echo "$DELETE_RESPONSE" | tail -1)
          DELETE_BODY=$(echo "$DELETE_RESPONSE" | sed '$d')

          if [ "$DELETE_CODE" -ge 200 ] && [ "$DELETE_CODE" -lt 300 ]; then
            echo "Delete request completed (HTTP $DELETE_CODE)."
          elif [ "$DELETE_CODE" -eq 404 ]; then
            echo "Container $CONTAINER_ID is already gone."
            exit 0
          elif [ "$DELETE_CODE" -eq 504 ]; then
            echo "Delete request timed out (HTTP 504); waiting for the container to disappear."
          else
            echo "::error::Failed to delete preview container $CONTAINER_ID. HTTP $DELETE_CODE — $DELETE_BODY"
            exit 1
          fi

          for attempt in $(seq 1 18); do
            RAW=$(curl -s -w "\n%{http_code}" \
              -H "Authorization: Bearer $API_KEY" \
              -H "Accept: application/json" \
              "$API_URL/api/v1/sites/$SITE_ID/containers?hostname=$CONTAINER_HOSTNAME")

            HTTP_CODE=$(echo "$RAW" | tail -1)
            BODY=$(echo "$RAW" | sed '$d')

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] && echo "$BODY" | jq empty >/dev/null 2>&1; then
              ACTIVE_ID=$(echo "$BODY" | jq -r '.data[0].id // .data[0].containerId // .containers[0].id // empty')
              if [ -z "$ACTIVE_ID" ] || [ "$ACTIVE_ID" = "null" ]; then
                echo "Container $CONTAINER_HOSTNAME has been removed."
                exit 0
              fi
              echo "Poll $attempt/18 — container still present (ID: $ACTIVE_ID)."
            else
              echo "Poll $attempt/18 — could not confirm deletion yet (HTTP $HTTP_CODE); retrying."
            fi

            sleep 10
          done

          echo "::error::Timed out waiting for preview container $CONTAINER_HOSTNAME to be deleted."
          exit 1

      - id: create
        name: Create preview container
        uses: mieweb/opensource-server/.github/actions/create-container@main
        with:
          api_key: ${{ secrets.LAUNCHPAD_API_KEY }}
          api_url: ${{ secrets.LAUNCHPAD_API_URL }}
          hostname: ${{ steps.preview.outputs.container_name }}
          template_name: ${{ needs.build-and-push.outputs.image_tag }}
          # DEV_QUICK_LOGIN_ENABLED is set via the build-args above, not here: the
          # current mieweb/launchpad@main create-container step posts this JSON
          # under the wrong request field, so the Container API silently drops it —
          # see PR #606. Once that's fixed upstream, it can move back to this list.
          container_env_vars: >-
            {"MONGO_URL":"mongodb://localhost:27017/timehuddle?replicaSet=rs0","MONGO_OPLOG_URL":"mongodb://localhost:27017/local?replicaSet=rs0","METEOR_AGENDA_ENABLED":"true","CORS_ORIGINS":"${{ steps.preview.outputs.url }}","APP_URL":"${{ steps.preview.outputs.url }}","ROOT_URL":"${{ steps.preview.outputs.api_url }}"}
          services: >-
            [{"type":"http","internalPort":3000,"externalHostname":"${{ steps.preview.outputs.container_name }}","externalDomainId":1},{"type":"http","internalPort":3100,"externalHostname":"${{ steps.preview.outputs.container_name }}-api","externalDomainId":1}]

      - id: wait-job
        name: Wait for preview create job
        if: steps.create.outputs.created == 'true'
        uses: mieweb/opensource-server/.github/actions/wait-for-job@main
        with:
          api_key: ${{ secrets.LAUNCHPAD_API_KEY }}
          api_url: ${{ secrets.LAUNCHPAD_API_URL }}
          job_id: ${{ steps.create.outputs.job_id }}

      - id: status
        name: Query preview container status
        if: steps.create.outputs.ready == 'true' || steps.create.outputs.created == 'true' || steps.wait-job.outputs.job_done == 'true'
        uses: mieweb/opensource-server/.github/actions/get-container@main
        with:
          api_key: ${{ secrets.LAUNCHPAD_API_KEY }}
          api_url: ${{ secrets.LAUNCHPAD_API_URL }}
          hostname: ${{ steps.preview.outputs.container_name }}

      - name: Verify preview container is running
        if: steps.status.outcome == 'success'
        env:
          CONTAINER_NAME: ${{ steps.preview.outputs.container_name }}
          FOUND: ${{ steps.status.outputs.found }}
          CONTAINER_STATUS: ${{ steps.status.outputs.status }}
          CONTAINER_IP: ${{ steps.status.outputs.ipv4_address }}
          SSH_PORT: ${{ steps.status.outputs.ssh_port }}
          HTTP_PORT: ${{ steps.status.outputs.http_port }}
          NODE_NAME: ${{ steps.status.outputs.node_name }}
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Container : $CONTAINER_NAME"
          echo "  Status    : ${CONTAINER_STATUS:-unknown}"
          echo "  IP        : ${CONTAINER_IP:-pending}"
          echo "  SSH Port  : ${SSH_PORT:-N/A}"
          echo "  HTTP Port : ${HTTP_PORT:-N/A}"
          echo "  Node      : ${NODE_NAME:-unknown}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          if [ "$FOUND" != "true" ]; then
            echo "::error::Container '$CONTAINER_NAME' was not found after creation."
            exit 1
          fi

          if [ "$CONTAINER_STATUS" != "running" ]; then
            echo "::error::Container status is '$CONTAINER_STATUS', expected 'running'."
            exit 1
          fi

      - name: Comment preview URL on PR
        if: success()
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          API_URL: ${{ steps.preview.outputs.api_url }}
        with:
          script: |
            const marker = '<!-- preview-url-comment -->';
            const body = `${marker}
            ## 🚀 Preview Deployment Ready

            | Service | URL |
            |---------|-----|
            | **App** | [${ process.env.PREVIEW_URL }](${ process.env.PREVIEW_URL }) |
            | **API** (Meteor) | ${ process.env.API_URL } |

            _Preview auto-deletes when this PR is closed._
            `;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Comment failure on PR
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- preview-url-comment -->';
            const body = `${marker}
            ## ❌ Preview Build Failed

            The preview deployment failed. [View logs](${ process.env.RUN_URL }) for details.
            `;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # ── Cleanup on PR close ───────────────────────────────────────────────────
  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - id: preview
        name: Compute preview container name
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          REPO_NAME=$(basename "${{ github.repository }}")
          CONTAINER_NAME="${{ github.repository_owner }}-${REPO_NAME}-${HEAD_REF}"
          CONTAINER_NAME=${CONTAINER_NAME,,}
          CONTAINER_NAME=$(echo "$CONTAINER_NAME" | sed 's/[^a-z0-9-]/-/g')
          CONTAINER_NAME=$(echo "$CONTAINER_NAME" | cut -c1-59 | sed 's/-*$//')
          echo "container_name=${CONTAINER_NAME}" >> "$GITHUB_OUTPUT"

      - id: locate
        name: Locate preview container for cleanup
        uses: mieweb/opensource-server/.github/actions/get-container@main
        with:
          api_key: ${{ secrets.LAUNCHPAD_API_KEY }}
          api_url: ${{ secrets.LAUNCHPAD_API_URL }}
          hostname: ${{ steps.preview.outputs.container_name }}

      - name: Delete preview container
        if: steps.locate.outputs.found == 'true'
        continue-on-error: true
        env:
          API_KEY: ${{ secrets.LAUNCHPAD_API_KEY }}
          API_URL: ${{ secrets.LAUNCHPAD_API_URL }}
          CONTAINER_ID: ${{ steps.locate.outputs.container_id }}
          SITE_ID: 1
        run: |
          set -euo pipefail

          DELETE_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X DELETE "$API_URL/api/v1/sites/$SITE_ID/containers/$CONTAINER_ID" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Accept: application/json")

          DELETE_CODE=$(echo "$DELETE_RESPONSE" | tail -1)
          DELETE_BODY=$(echo "$DELETE_RESPONSE" | sed '$d')

          if [ "$DELETE_CODE" -ge 200 ] && [ "$DELETE_CODE" -lt 300 ]; then
            echo "Delete request completed (HTTP $DELETE_CODE)."
          elif [ "$DELETE_CODE" -eq 404 ] || [ "$DELETE_CODE" -eq 504 ]; then
            echo "Delete request returned HTTP $DELETE_CODE; cleanup will continue."
          else
            echo "::error::Failed to delete preview container $CONTAINER_ID. HTTP $DELETE_CODE — $DELETE_BODY"
            exit 1
          fi

      - name: Comment cleanup on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-url-comment -->';
            const body = `${marker}
            ## 🗑️ Preview Environment Cleaned Up

            The preview container for this PR has been deleted.
            `;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
