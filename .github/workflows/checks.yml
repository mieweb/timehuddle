name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev, prod, master]

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      # - name: Test
      #   run: npm test

      - name: Release script tests
        run: npm run test:release-scripts

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  backend:
    if: false # Disabled - Fastify backend removed, Meteor backend doesn't have these npm scripts
    name: Backend Checks
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Format
        working-directory: backend
        run: npm run format

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Test
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/timehuddle_test
          BETTER_AUTH_SECRET: ci-test-secret
          PORT: 4000
        run: npm test

      - name: Upload backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 1

  ios:
    name: iOS Checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vite build
        run: npm run build
        env:
          CAPACITOR: '1'

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Patch Package.swift for CapgoCapacitorUpdater transitive SPM deps
        run: python3 scripts/patch-ios-spm.py

      - name: Build for simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
