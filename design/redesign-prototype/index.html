<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TimeHuddle — Redesign Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class', theme: { extend: {} } };
    </script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overscroll-behavior-y: none;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(120, 120, 120, 0.35);
        border-radius: 3px;
      }
      .scrollbar-none::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-none {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes pulseDot {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      .pulse-dot {
        animation: pulseDot 1.6s ease-in-out infinite;
      }
      .fade-in {
        animation: fadeIn 0.15s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100">
    <div id="root"></div>

    <script type="text/plain" id="app-src">
      const { useState, useEffect, useMemo, useRef, useCallback } = React;

      /* ============================== UTILITIES ============================== */

      const STORAGE_KEY = "th_prototype_state_v3";

      const uid = (p = "id") => `${p}_${Math.random().toString(36).slice(2, 9)}${Date.now().toString(36).slice(-4)}`;

      const AVATAR_COLORS = {
        indigo: "bg-indigo-100 text-indigo-600 dark:bg-indigo-500/20 dark:text-indigo-300",
        teal: "bg-teal-100 text-teal-600 dark:bg-teal-500/20 dark:text-teal-300",
        coral: "bg-red-100 text-red-500 dark:bg-red-500/20 dark:text-red-300",
        amber: "bg-amber-100 text-amber-600 dark:bg-amber-500/20 dark:text-amber-300",
        pink: "bg-pink-100 text-pink-500 dark:bg-pink-500/20 dark:text-pink-300",
        green: "bg-green-100 text-green-600 dark:bg-green-500/20 dark:text-green-300",
      };
      const colorKeys = Object.keys(AVATAR_COLORS);
      const colorForName = (name) => colorKeys[Math.abs(hashStr(name)) % colorKeys.length];
      function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h << 5) - h + s.charCodeAt(i); return h; }
      function initials(name) { return name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase(); }

      function fmtDuration(ms) {
        if (ms < 0) ms = 0;
        const totalSec = Math.floor(ms / 1000);
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        if (h > 0) return `${h}h ${m}m`;
        if (m > 0) return `${m}m ${s}s`;
        return `${s}s`;
      }
      function fmtClock(ms) {
        const totalSec = Math.floor(ms / 1000);
        const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
        const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
        const s = String(totalSec % 60).padStart(2, "0");
        return `${h}:${m}:${s}`;
      }
      function timeAgo(ts) {
        const diff = Date.now() - ts;
        const min = Math.floor(diff / 60000);
        if (min < 1) return "just now";
        if (min < 60) return `${min}m`;
        const hr = Math.floor(min / 60);
        if (hr < 24) return `${hr}h`;
        const d = Math.floor(hr / 24);
        if (d < 7) return `${d}d`;
        return new Date(ts).toLocaleDateString();
      }
      function todayKey(d = new Date()) { return d.toISOString().slice(0, 10); }

      /* Very small markdown-ish renderer: **bold**, *italic*, line breaks, `code` */
      function renderRich(text) {
        if (!text) return null;
        const lines = text.split("\n");
        return lines.map((line, i) => {
          const parts = [];
          const re = /(\*\*[^*]+\*\*|`[^`]+`|@[\w.]+)/g;
          let last = 0, m, key = 0;
          while ((m = re.exec(line))) {
            if (m.index > last) parts.push(line.slice(last, m.index));
            const tok = m[0];
            if (tok.startsWith("**")) parts.push(<strong key={key++}>{tok.slice(2, -2)}</strong>);
            else if (tok.startsWith("`")) parts.push(<code key={key++} className="px-1 py-0.5 rounded bg-gray-100 dark:bg-gray-800 text-[0.85em]">{tok.slice(1, -1)}</code>);
            else if (tok.startsWith("@")) parts.push(<span key={key++} className="text-indigo-600 dark:text-indigo-400 font-medium">{tok}</span>);
            last = m.index + tok.length;
          }
          if (last < line.length) parts.push(line.slice(last));
          return <span key={i}>{parts.length ? parts : line}{i < lines.length - 1 ? <br /> : null}</span>;
        });
      }

      /* ============================== SEED DATA ============================== */

      function seedState() {
        const orgId = "org_acme";
        const teamAId = "team_platform";
        const teamBId = "team_support";
        const users = [
          { id: "u_you", name: "You (Priya Das)", avatarColor: "indigo" },
          { id: "u_alex", name: "Alex Kim", avatarColor: "teal" },
          { id: "u_sam", name: "Sam Ortiz", avatarColor: "amber" },
          { id: "u_jo", name: "Jo Reyes", avatarColor: "pink" },
        ];
        const orgs = [{ id: orgId, name: "Acme Corp", ownerId: "u_you" }];
        const teams = [
          {
            id: teamAId, orgId, name: "Platform Team",
            members: [
              { userId: "u_you", role: "owner" },
              { userId: "u_alex", role: "admin" },
              { userId: "u_sam", role: "member" },
            ],
            settings: { requirePlanForClock: true },
            joinCode: "PLT-8421",
          },
          {
            id: teamBId, orgId, name: "Support Team",
            members: [
              { userId: "u_you", role: "owner" },
              { userId: "u_jo", role: "member" },
            ],
            settings: { requirePlanForClock: false },
            joinCode: "SUP-1190",
          },
        ];
        const now = Date.now();
        const tickets = [
          { id: uid("tk"), teamId: teamAId, title: "Fix flaky login redirect", status: "in_progress", assigneeId: "u_you", source: "github", ref: "#482", priority: "high", createdAt: now - 86400000 * 3, loggedMs: 5400000 },
          { id: uid("tk"), teamId: teamAId, title: "Add dark mode to settings page", status: "open", assigneeId: "u_alex", source: "github", ref: "#491", priority: "medium", createdAt: now - 86400000 * 2, loggedMs: 0 },
          { id: uid("tk"), teamId: teamAId, title: "Investigate DB connection pool leak", status: "open", assigneeId: "u_sam", source: "redmine", ref: "RM-1183", priority: "high", createdAt: now - 86400000, loggedMs: 1800000 },
          { id: uid("tk"), teamId: teamAId, title: "Write onboarding docs", status: "done", assigneeId: "u_you", source: "local", ref: null, priority: "low", createdAt: now - 86400000 * 6, loggedMs: 7200000 },
          { id: uid("tk"), teamId: teamBId, title: "Customer escalation: billing sync", status: "in_progress", assigneeId: "u_jo", source: "redmine", ref: "RM-1201", priority: "high", createdAt: now - 3600000 * 5, loggedMs: 3600000 },
        ];
        const posts = [
          { id: uid("p"), teamId: teamAId, authorId: "u_alex", content: "Shipped the **dark mode** toggle groundwork — CSS vars are in place, wiring up settings UI next.", createdAt: now - 3600000 * 2, status: "published", likes: ["u_you"], comments: [{ id: uid("c"), authorId: "u_sam", content: "Nice, been waiting for this 🎉", createdAt: now - 3400000 }], ticketId: null },
          { id: uid("p"), teamId: teamAId, authorId: "u_sam", content: "Plan for today:\n- Reproduce the pool leak under load\n- Pair with @Alex on the fix if needed", createdAt: now - 3600000 * 20, status: "published", likes: [], comments: [], ticketId: tickets[2].id },
        ];
        return {
          version: 3,
          currentUserId: "u_you",
          currentOrgId: orgId,
          currentTeamId: teamAId,
          theme: "light",
          users, orgs, teams, tickets, posts,
          clockEvents: [
            { id: uid("ce"), userId: "u_you", teamId: teamAId, startAt: now - 86400000 - 3600000 * 6, endAt: now - 86400000 - 3600000 * 2, planPostId: null, ticketId: tickets[0].id },
          ],
          toasts: [],
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.version === 3) return parsed;
          }
        } catch (e) {}
        return seedState();
      }

      /* ============================== APP CONTEXT ============================== */

      const AppCtx = React.createContext(null);
      function useApp() { return React.useContext(AppCtx); }

      function AppProvider({ children }) {
        const [state, setState] = useState(loadState);
        useEffect(() => {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, toasts: [] }));
        }, [state]);
        useEffect(() => {
          document.documentElement.classList.toggle("dark", state.theme === "dark");
        }, [state.theme]);

        const patch = useCallback((fn) => setState(prev => fn(prev) || prev), []);

        const toast = useCallback((message, kind = "info") => {
          const id = uid("t");
          setState(prev => ({ ...prev, toasts: [...prev.toasts, { id, message, kind }] }));
          setTimeout(() => setState(prev => ({ ...prev, toasts: prev.toasts.filter(t => t.id !== id) })), 3200);
        }, []);

        const resetDemo = useCallback(() => { setState(seedState()); }, []);

        const value = { state, setState, patch, toast, resetDemo };
        return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
      }

      /* ============================== DERIVED HELPERS ============================== */

      function useDerived() {
        const { state } = useApp();
        const currentUser = state.users.find(u => u.id === state.currentUserId);
        const currentOrg = state.orgs.find(o => o.id === state.currentOrgId);
        const orgTeams = state.teams.filter(t => t.orgId === state.currentOrgId);
        const currentTeam = state.teams.find(t => t.id === state.currentTeamId) || orgTeams[0];
        const membership = currentTeam ? currentTeam.members.find(m => m.userId === state.currentUserId) : null;
        const role = membership ? membership.role : "member";
        const isOwner = currentOrg && currentOrg.ownerId === state.currentUserId;
        const isTeamAdmin = role === "admin" || role === "owner";
        const activeClockEvent = state.clockEvents.find(ce => ce.userId === state.currentUserId && ce.teamId === currentTeam?.id && !ce.endAt);
        const userById = (id) => state.users.find(u => u.id === id);
        return { currentUser, currentOrg, orgTeams, currentTeam, role, isOwner, isTeamAdmin, activeClockEvent, userById };
      }

      /* ============================== SHARED UI ============================== */

      function Avatar({ user, size = "md" }) {
        const sizes = { sm: "w-7 h-7 text-[10px]", md: "w-9 h-9 text-[13px]", lg: "w-14 h-14 text-lg" };
        const color = AVATAR_COLORS[user?.avatarColor || colorForName(user?.name || "?")];
        return (
          <div className={`rounded-full flex items-center justify-center font-semibold shrink-0 ${sizes[size]} ${color}`}>
            {initials(user?.name || "?")}
          </div>
        );
      }

      function Badge({ children, tone = "gray" }) {
        const tones = {
          gray: "bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-300",
          green: "bg-green-100 text-green-700 dark:bg-green-500/20 dark:text-green-300",
          amber: "bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300",
          red: "bg-red-100 text-red-600 dark:bg-red-500/20 dark:text-red-300",
          indigo: "bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300",
          purple: "bg-purple-100 text-purple-700 dark:bg-purple-500/20 dark:text-purple-300",
        };
        return <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium ${tones[tone]}`}>{children}</span>;
      }

      function Button({ children, onClick, variant = "primary", size = "md", disabled, className = "", title, type = "button" }) {
        const base = "inline-flex items-center justify-center gap-1.5 font-semibold rounded-full transition-colors disabled:opacity-40 disabled:cursor-not-allowed";
        const sizes = { sm: "text-xs px-3 py-1.5", md: "text-sm px-4 py-2", lg: "text-sm px-5 py-2.5" };
        const variants = {
          primary: "bg-indigo-600 text-white hover:bg-indigo-700",
          secondary: "bg-gray-100 text-gray-700 hover:bg-gray-200 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700",
          danger: "bg-red-600 text-white hover:bg-red-700",
          ghost: "text-gray-500 hover:text-gray-800 hover:bg-gray-100 dark:hover:bg-gray-800 dark:hover:text-gray-100",
          outline: "border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800",
        };
        return (
          <button type={type} title={title} disabled={disabled} onClick={onClick} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>
            {children}
          </button>
        );
      }

      function IconBtn({ children, onClick, active, title, className = "" }) {
        return (
          <button title={title} onClick={onClick}
            className={`w-9 h-9 rounded-full flex items-center justify-center transition-colors shrink-0 ${active ? "bg-indigo-600 text-white" : "bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700"} ${className}`}>
            {children}
          </button>
        );
      }

      function Modal({ open, onClose, title, children, footer, wide }) {
        if (!open) return null;
        return (
          <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 fade-in" onClick={onClose}>
            <div onClick={e => e.stopPropagation()}
              className={`bg-white dark:bg-gray-900 w-full ${wide ? "sm:max-w-lg" : "sm:max-w-md"} sm:rounded-2xl rounded-t-2xl max-h-[88vh] flex flex-col shadow-xl`}>
              <div className="flex items-center justify-between px-5 py-4 border-b border-gray-100 dark:border-gray-800 shrink-0">
                <h2 className="font-semibold text-gray-900 dark:text-gray-100">{title}</h2>
                <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center text-gray-400">✕</button>
              </div>
              <div className="px-5 py-4 overflow-y-auto">{children}</div>
              {footer && <div className="px-5 py-3 border-t border-gray-100 dark:border-gray-800 flex justify-end gap-2 shrink-0">{footer}</div>}
            </div>
          </div>
        );
      }

      function ConfirmModal({ open, onClose, onConfirm, title, message, confirmLabel = "Delete" }) {
        return (
          <Modal open={open} onClose={onClose} title={title}
            footer={<>
              <Button variant="outline" onClick={onClose}>Cancel</Button>
              <Button variant="danger" onClick={() => { onConfirm(); onClose(); }}>{confirmLabel}</Button>
            </>}>
            <p className="text-sm text-gray-600 dark:text-gray-300">{message}</p>
          </Modal>
        );
      }

      function Field({ label, children }) {
        return <label className="block mb-3"><span className="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">{label}</span>{children}</label>;
      }
      function TextInput(props) {
        return <input {...props} className={`w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm outline-none focus:border-indigo-400 dark:focus:border-indigo-500 ${props.className || ""}`} />;
      }
      function Select({ value, onChange, options, className = "" }) {
        return (
          <select value={value} onChange={onChange} className={`w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm outline-none focus:border-indigo-400 ${className}`}>
            {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        );
      }

      function ToastStack() {
        const { state } = useApp();
        return (
          <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 items-center px-4 w-full sm:w-auto">
            {state.toasts.map(t => (
              <div key={t.id} className={`fade-in px-4 py-2 rounded-full text-sm font-medium shadow-lg text-white ${t.kind === "error" ? "bg-red-600" : t.kind === "success" ? "bg-green-600" : "bg-gray-900 dark:bg-gray-700"}`}>
                {t.message}
              </div>
            ))}
          </div>
        );
      }

      /* Ticket source badge */
      function SourceBadge({ source }) {
        if (source === "github") return <Badge tone="gray">🐙 GitHub</Badge>;
        if (source === "redmine") return <Badge tone="red">◆ Redmine</Badge>;
        return <Badge tone="indigo">Local</Badge>;
      }
      function StatusBadge({ status }) {
        if (status === "open") return <Badge tone="amber">Open</Badge>;
        if (status === "in_progress") return <Badge tone="indigo">In Progress</Badge>;
        return <Badge tone="green">Done</Badge>;
      }
      function RoleBadge({ role }) {
        if (role === "owner") return <Badge tone="purple">Owner</Badge>;
        if (role === "admin") return <Badge tone="indigo">Admin</Badge>;
        return <Badge tone="gray">Member</Badge>;
      }

      /* ============================== NAVIGATION SHELL ============================== */

      const NAV_ITEMS = [
        { key: "dashboard", label: "Dashboard", icon: "🏠" },
        { key: "huddle", label: "Huddle", icon: "💬" },
        { key: "clock", label: "Clock", icon: "⏱️" },
        { key: "tickets", label: "Tickets", icon: "🎫" },
        { key: "teams", label: "Teams", icon: "👥" },
        { key: "org", label: "Organization", icon: "🏢" },
      ];

      function App() {
        const { state, patch, resetDemo } = useApp();
        const derived = useDerived();
        const [page, setPage] = useState("dashboard");
        const [moreOpen, setMoreOpen] = useState(false);
        const [switcherOpen, setSwitcherOpen] = useState(false);

        const goto = (p) => { setPage(p); setMoreOpen(false); };

        return (
          <div className="h-screen w-screen flex flex-col sm:flex-row overflow-hidden">
            <ToastStack />
            {/* Desktop sidebar */}
            <aside className="hidden sm:flex sm:flex-col w-64 shrink-0 border-r border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900 h-full">
              <div className="px-4 py-4 border-b border-gray-100 dark:border-gray-800">
                <div className="flex items-center gap-2 mb-3">
                  <div className="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold">TH</div>
                  <span className="font-semibold">TimeHuddle</span>
                </div>
                <OrgTeamSwitcher />
              </div>
              <nav className="flex-1 overflow-y-auto py-2 px-2">
                {NAV_ITEMS.map(item => (
                  <button key={item.key} onClick={() => goto(item.key)}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium mb-1 transition-colors ${page === item.key ? "bg-indigo-50 text-indigo-700 dark:bg-indigo-500/10 dark:text-indigo-300" : "text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800"}`}>
                    <span>{item.icon}</span>{item.label}
                    {item.key === "clock" && derived.activeClockEvent && <span className="ml-auto w-2 h-2 rounded-full bg-green-500 pulse-dot" />}
                  </button>
                ))}
              </nav>
              <div className="p-3 border-t border-gray-100 dark:border-gray-800">
                <ProfileMini onOpenProfile={() => goto("profile")} />
              </div>
            </aside>

            {/* Mobile top bar */}
            <header className="sm:hidden flex items-center justify-between px-4 py-3 bg-white dark:bg-gray-900 border-b border-gray-100 dark:border-gray-800 shrink-0">
              <button onClick={() => setSwitcherOpen(true)} className="flex items-center gap-2 min-w-0">
                <div className="w-7 h-7 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shrink-0">TH</div>
                <div className="text-left min-w-0">
                  <div className="text-sm font-semibold truncate max-w-[45vw]">{derived.currentTeam?.name}</div>
                  <div className="text-[11px] text-gray-400 truncate max-w-[45vw]">{derived.currentOrg?.name} ▾</div>
                </div>
              </button>
              <div className="flex items-center gap-2">
                {derived.activeClockEvent && <Badge tone="green">● Clocked in</Badge>}
                <IconBtn title="Profile" onClick={() => goto("profile")}><Avatar user={derived.currentUser} size="sm" /></IconBtn>
              </div>
            </header>

            {/* Main content */}
            <main className="flex-1 min-w-0 overflow-y-auto bg-gray-50 dark:bg-gray-950">
              {page === "dashboard" && <Dashboard />}
              {page === "huddle" && <Huddle />}
              {page === "clock" && <ClockPage />}
              {page === "tickets" && <Tickets />}
              {page === "teams" && <Teams onOpenTeam={() => goto("teams")} />}
              {page === "org" && <OrgSettings />}
              {page === "profile" && <ProfilePage />}
            </main>

            {/* Mobile bottom nav */}
            <nav className="sm:hidden flex items-stretch bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 shrink-0 pb-[env(safe-area-inset-bottom)]">
              {NAV_ITEMS.filter(i => i.key !== "org" && i.key !== "clock").slice(0, 2).map(item => (
                <NavTab key={item.key} item={item} active={page === item.key} onClick={() => goto(item.key)} />
              ))}
              <button onClick={() => goto("clock")} className="flex-1 flex flex-col items-center justify-center py-2 relative">
                <div className={`w-11 h-11 -mt-4 rounded-full flex items-center justify-center text-white shadow-lg ${derived.activeClockEvent ? "bg-green-500" : "bg-indigo-600"}`}>
                  <span className="text-lg">⏱️</span>
                </div>
                <span className={`text-[10px] mt-0.5 font-medium ${page === "clock" ? "text-indigo-600" : "text-gray-500"}`}>Clock</span>
              </button>
              <NavTab item={NAV_ITEMS[3]} active={page === "tickets"} onClick={() => goto("tickets")} />
              <button onClick={() => setMoreOpen(true)} className="flex-1 flex flex-col items-center justify-center py-2 gap-0.5">
                <span className="text-lg">☰</span>
                <span className="text-[10px] text-gray-500 font-medium">More</span>
              </button>
            </nav>

            {/* Mobile "more" sheet */}
            <Modal open={moreOpen} onClose={() => setMoreOpen(false)} title="More">
              <div className="grid grid-cols-3 gap-3">

      /* ============================== DASHBOARD ============================== */

            <div className="flex items-center justify-between mb-4">
              <h1 className="text-xl font-bold">Dashboard</h1>
              <div className="inline-flex rounded-full bg-gray-100 dark:bg-gray-800 p-1">
                <button onClick={() => setTab("me")} className={`px-4 py-1.5 rounded-full text-sm font-medium ${tab === "me" ? "bg-white dark:bg-gray-700 shadow-sm" : "text-gray-500"}`}>Me</button>
                <button onClick={() => setTab("team")} className={`px-4 py-1.5 rounded-full text-sm font-medium ${tab === "team" ? "bg-white dark:bg-gray-700 shadow-sm" : "text-gray-500"}`}>Team</button>
              </div>
