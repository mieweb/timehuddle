      function useWeeklyHours(userId, teamId) {
        const { state } = useApp();
        return useMemo(() => {
          const days = [...Array(7)].map((_, i) => {
            const d = new Date(); d.setDate(d.getDate() - (6 - i));
            const key = todayKey(d);
            const ms = state.clockEvents.filter(ce => ce.userId === userId && ce.teamId === teamId && todayKey(new Date(ce.startAt)) === key)
              .reduce((sum, ce) => sum + ((ce.endAt || Date.now()) - ce.startAt), 0);
            return { label: d.toLocaleDateString(undefined, { weekday: "short" }), ms };
          });
          return days;
        }, [state.clockEvents, userId, teamId]);
      }

      function MyDashboard() {
        const { state } = useApp();
        const derived = useDerived();
        const week = useWeeklyHours(state.currentUserId, derived.currentTeam?.id);
        const maxMs = Math.max(...week.map(d => d.ms), 3600000);
        const myTickets = state.tickets.filter(t => t.teamId === derived.currentTeam?.id && t.assigneeId === state.currentUserId);
        const myOpen = myTickets.filter(t => t.status !== "done").length;
        const myPosts = state.posts.filter(p => p.teamId === derived.currentTeam?.id && p.authorId === state.currentUserId && p.status === "published").slice(-3).reverse();
        const todayMs = week[week.length - 1].ms + (derived.activeClockEvent ? Date.now() - derived.activeClockEvent.startAt : 0);

        return (
          <div className="space-y-4">
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <StatCard label="Today" value={fmtDuration(todayMs)} icon="⏱️" />
              <StatCard label="This week" value={fmtDuration(week.reduce((s, d) => s + d.ms, 0))} icon="📅" />
              <StatCard label="Open tickets" value={myOpen} icon="🎫" />
              <StatCard label="Status" value={derived.activeClockEvent ? "Clocked in" : "Clocked out"} icon={derived.activeClockEvent ? "🟢" : "⚪"} tone={derived.activeClockEvent ? "green" : "gray"} />
            </div>

            <Card title="This week">
              <div className="flex items-end gap-3 h-32 px-1">
                {week.map((d, i) => (
                  <div key={i} className="flex-1 flex flex-col items-center gap-1.5">
                    <div className="w-full bg-gray-100 dark:bg-gray-800 rounded-t-md flex items-end" style={{ height: "100%" }}>
                      <div className="w-full bg-indigo-500 rounded-t-md" style={{ height: `${Math.max(4, (d.ms / maxMs) * 100)}%` }} title={fmtDuration(d.ms)} />
                    </div>
                    <span className="text-[11px] text-gray-400">{d.label}</span>
                  </div>
                ))}
              </div>
            </Card>

            <Card title="My recent plans & updates" action={myPosts.length === 0 ? "Nothing posted yet" : null}>
              <div className="space-y-3">
                {myPosts.map(p => (
                  <div key={p.id} className="text-sm border-l-2 border-indigo-200 dark:border-indigo-800 pl-3">
                    <div className="text-gray-400 text-xs mb-0.5">{timeAgo(p.createdAt)} ago</div>
                    <div className="text-gray-700 dark:text-gray-200">{renderRich(p.content.slice(0, 140))}</div>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        );
      }

      function StatCard({ label, value, icon, tone }) {
        return (
          <div className="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 p-4">
            <div className="text-xs text-gray-400 mb-1 flex items-center gap-1">{label}</div>
            <div className={`text-xl font-bold ${tone === "green" ? "text-green-600" : "text-gray-900 dark:text-gray-100"}`}>{icon} {value}</div>
          </div>
        );
      }

      function Card({ title, children, action, right }) {
        return (
          <div className="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 p-4">
            <div className="flex items-center justify-between mb-3">
              <h3 className="text-sm font-semibold text-gray-700 dark:text-gray-200">{title}</h3>
              {right}
            </div>
            {children}
            {action && <div className="text-xs text-gray-400 mt-2">{action}</div>}
          </div>
        );
      }

      function TeamDashboard() {
        const { state } = useApp();
        const derived = useDerived();
        const team = derived.currentTeam;
        if (!team) return null;
        const members = team.members.map(m => derived.userById(m.userId)).filter(Boolean);
        const activeNow = state.clockEvents.filter(ce => ce.teamId === team.id && !ce.endAt);
        const teamTickets = state.tickets.filter(t => t.teamId === team.id);
        const counts = {
          open: teamTickets.filter(t => t.status === "open").length,
          in_progress: teamTickets.filter(t => t.status === "in_progress").length,
          done: teamTickets.filter(t => t.status === "done").length,
        };
        const totalTodayMs = state.clockEvents.filter(ce => ce.teamId === team.id && todayKey(new Date(ce.startAt)) === todayKey())
          .reduce((s, ce) => s + ((ce.endAt || Date.now()) - ce.startAt), 0);
        const recentPosts = state.posts.filter(p => p.teamId === team.id && p.status === "published").slice(-4).reverse();

        return (
          <div className="space-y-4">
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <StatCard label="Members" value={members.length} icon="👥" />
              <StatCard label="Clocked in now" value={activeNow.length} icon="🟢" tone="green" />
              <StatCard label="Team hours today" value={fmtDuration(totalTodayMs)} icon="⏱️" />
              <StatCard label="Open tickets" value={counts.open + counts.in_progress} icon="🎫" />
            </div>

            <Card title="Team status">
              <div className="space-y-2">
                {team.members.map(m => {
                  const u = derived.userById(m.userId);
                  const active = activeNow.find(ce => ce.userId === m.userId);
                  return (
                    <div key={m.userId} className="flex items-center gap-3 py-1.5">
                      <div className="relative">
                        <Avatar user={u} size="sm" />
                        {active && <span className="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-green-500 border-2 border-white dark:border-gray-900 pulse-dot" />}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="text-sm font-medium truncate">{u?.name}</div>
                        <div className="text-[11px] text-gray-400">{active ? `Clocked in · ${fmtDuration(Date.now() - active.startAt)}` : "Clocked out"}</div>
                      </div>
                      <RoleBadge role={m.role} />
                    </div>
                  );
                })}
              </div>
            </Card>

            <Card title="Ticket board">
              <div className="grid grid-cols-3 gap-2 text-center">
                <div className="bg-amber-50 dark:bg-amber-500/10 rounded-lg py-3"><div className="text-lg font-bold text-amber-600">{counts.open}</div><div className="text-[11px] text-gray-500">Open</div></div>
                <div className="bg-indigo-50 dark:bg-indigo-500/10 rounded-lg py-3"><div className="text-lg font-bold text-indigo-600">{counts.in_progress}</div><div className="text-[11px] text-gray-500">In Progress</div></div>
                <div className="bg-green-50 dark:bg-green-500/10 rounded-lg py-3"><div className="text-lg font-bold text-green-600">{counts.done}</div><div className="text-[11px] text-gray-500">Done</div></div>
              </div>
            </Card>

            <Card title="Recent team activity">
              <div className="space-y-3">
                {recentPosts.length === 0 && <div className="text-xs text-gray-400">No posts yet.</div>}
                {recentPosts.map(p => (
                  <div key={p.id} className="flex gap-2 text-sm">
                    <Avatar user={derived.userById(p.authorId)} size="sm" />
                    <div className="min-w-0">
                      <div className="text-xs text-gray-400">{derived.userById(p.authorId)?.name} · {timeAgo(p.createdAt)} ago</div>
                      <div className="text-gray-700 dark:text-gray-200 truncate">{renderRich(p.content.slice(0, 120))}</div>
                    </div>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        );
      }

      /* ============================== CLOCK PAGE ============================== */

      function ClockPage() {
        const { state, patch, toast } = useApp();
        const derived = useDerived();
        const team = derived.currentTeam;
        const [, forceTick] = useState(0);
        useEffect(() => { const t = setInterval(() => forceTick(x => x + 1), 1000); return () => clearInterval(t); }, []);

        const gateOn = team?.settings?.requirePlanForClock;
        const active = derived.activeClockEvent;
        const [planText, setPlanText] = useState("");
        const [wrapText, setWrapText] = useState("");
        const [selectedTicket, setSelectedTicket] = useState("");
        const teamTickets = state.tickets.filter(t => t.teamId === team?.id);

        const myPastSessions = state.clockEvents.filter(ce => ce.userId === state.currentUserId && ce.teamId === team?.id && ce.endAt).sort((a, b) => b.startAt - a.startAt).slice(0, 8);

        const doClockIn = (withPlanPostId) => {
          patch(prev => ({
            ...prev,
            clockEvents: [...prev.clockEvents, { id: uid("ce"), userId: prev.currentUserId, teamId: team.id, startAt: Date.now(), endAt: null, planPostId: withPlanPostId || null, ticketId: selectedTicket || null }],
          }));
          toast("Clocked in", "success");
        };

        const publishPlanAndClockIn = () => {
          if (gateOn && !planText.trim()) { toast("Write today's plan first", "error"); return; }
          let planPostId = null;
          if (planText.trim()) {
            planPostId = uid("p");
            patch(prev => ({ ...prev, posts: [...prev.posts, { id: planPostId, teamId: team.id, authorId: prev.currentUserId, content: planText.trim(), createdAt: Date.now(), status: "published", likes: [], comments: [], ticketId: selectedTicket || null }] }));
          }
          doClockIn(planPostId);
          setPlanText("");
        };

        const clockOutDirect = () => {
          patch(prev => ({ ...prev, clockEvents: prev.clockEvents.map(ce => ce.id === active.id ? { ...ce, endAt: Date.now() } : ce) }));
          if (active.ticketId) patch(prev => ({ ...prev, tickets: prev.tickets.map(t => t.id === active.ticketId ? { ...t, loggedMs: (t.loggedMs || 0) + (Date.now() - active.startAt) } : t) }));
          toast("Clocked out", "success");
        };

        const publishWrapupAndClockOut = () => {
          if (gateOn && !wrapText.trim()) { toast("Add a wrap-up before clocking out", "error"); return; }
          if (wrapText.trim()) {
            patch(prev => ({ ...prev, posts: [...prev.posts, { id: uid("p"), teamId: team.id, authorId: prev.currentUserId, content: `**Wrap-up:** ${wrapText.trim()}`, createdAt: Date.now(), status: "published", likes: [], comments: [], ticketId: active.ticketId || null }] }));
          }
          clockOutDirect();
          setWrapText("");
        };

        if (!team) return <EmptyState title="No team selected" />;

        return (
          <div className="max-w-2xl mx-auto p-4 sm:p-6 space-y-4">
            <h1 className="text-xl font-bold">Clock</h1>

            <div className={`rounded-2xl p-5 text-center border ${active ? "bg-green-50 dark:bg-green-500/10 border-green-200 dark:border-green-800" : "bg-white dark:bg-gray-900 border-gray-100 dark:border-gray-800"}`}>
              <div className="text-xs uppercase tracking-wide text-gray-400 font-semibold mb-1">{active ? "Clocked in" : "Clocked out"}</div>
              <div className="text-4xl font-bold tabular-nums mb-1">{active ? fmtClock(Date.now() - active.startAt) : "00:00:00"}</div>
              {active && <div className="text-xs text-gray-500">since {new Date(active.startAt).toLocaleTimeString()}{active.ticketId && <> · on <strong>{state.tickets.find(t => t.id === active.ticketId)?.title}</strong></>}</div>}
              {gateOn && <div className="mt-2"><Badge tone="indigo">Plan required for this team</Badge></div>}
            </div>

            {!active ? (
              <Card title="Plan before you clock in">
                <p className="text-xs text-gray-400 mb-2">{gateOn ? "This team requires a short plan before clocking in. It's posted to Huddle so your team can see what you're working on." : "Optional — write what you're about to work on. It'll post to Huddle."}</p>
                <RichTextArea value={planText} onChange={setPlanText} placeholder="What are you planning to work on right now?" />
                <div className="mt-2">
                  <Field label="Attach to a ticket (optional)">
                    <Select value={selectedTicket} onChange={e => setSelectedTicket(e.target.value)} options={[{ value: "", label: "No ticket" }, ...teamTickets.map(t => ({ value: t.id, label: t.title }))]} />
                  </Field>
                </div>
                <div className="flex gap-2 justify-end mt-2">
                  {!gateOn && <Button variant="outline" onClick={() => doClockIn(null)}>Clock in without a plan</Button>}
                  <Button onClick={publishPlanAndClockIn}>Post plan & clock in</Button>
                </div>
              </Card>
            ) : (
              <Card title="Wrap up before you clock out">
                <p className="text-xs text-gray-400 mb-2">{gateOn ? "Add a quick wrap-up of what you did this session before clocking out." : "Optional — summarize what you did this session."}</p>
                <RichTextArea value={wrapText} onChange={setWrapText} placeholder="What did you get done this session?" />
                <div className="flex gap-2 justify-end mt-2">
                  {!gateOn && <Button variant="outline" onClick={clockOutDirect}>Clock out without wrap-up</Button>}
                  <Button variant="danger" onClick={publishWrapupAndClockOut}>Post wrap-up & clock out</Button>
                </div>
              </Card>
            )}

            <Card title="Recent sessions">
              <div className="divide-y divide-gray-100 dark:divide-gray-800">
                {myPastSessions.length === 0 && <div className="text-xs text-gray-400 py-2">No sessions yet.</div>}
                {myPastSessions.map(ce => (
                  <div key={ce.id} className="py-2 flex items-center justify-between text-sm">
                    <div>
                      <div className="font-medium">{new Date(ce.startAt).toLocaleDateString()}</div>
                      <div className="text-xs text-gray-400">{new Date(ce.startAt).toLocaleTimeString()} – {new Date(ce.endAt).toLocaleTimeString()}</div>
                    </div>
                    <Badge tone="gray">{fmtDuration(ce.endAt - ce.startAt)}</Badge>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        );
      }

      function RichTextArea({ value, onChange, placeholder }) {
        return (
          <div>
            <textarea value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} rows={4}
              className="w-full px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm outline-none focus:border-indigo-400 resize-none leading-relaxed" />
            <div className="text-[11px] text-gray-400 mt-1">Supports **bold**, `code`, and @mentions — this simulates the Kerebron rich editor.</div>
          </div>
        );
      }

      function EmptyState({ title, sub }) {
        return <div className="p-10 text-center text-gray-400"><div className="text-lg font-medium mb-1">{title}</div><div className="text-sm">{sub}</div></div>;
      }

      /* ============================== HUDDLE / FEED ============================== */

      function Huddle() {
        const { state, patch, toast } = useApp();
        const derived = useDerived();
        const team = derived.currentTeam;
        const [view, setView] = useState("feed");
        const [composerOpen, setComposerOpen] = useState(false);
        const [text, setText] = useState("");
        const [editingDraftId, setEditingDraftId] = useState(null);

        if (!team) return <EmptyState title="No team selected" />;

        const feedPosts = state.posts.filter(p => p.teamId === team.id && p.status === "published").sort((a, b) => b.createdAt - a.createdAt);
        const myDrafts = state.posts.filter(p => p.teamId === team.id && p.status === "draft" && p.authorId === state.currentUserId).sort((a, b) => b.createdAt - a.createdAt);

        const submitPost = () => {
          if (!text.trim()) return;
          patch(prev => ({ ...prev, posts: [...prev.posts, { id: uid("p"), teamId: team.id, authorId: prev.currentUserId, content: text.trim(), createdAt: Date.now(), status: "published", likes: [], comments: [], ticketId: null }] }));
          setText(""); setComposerOpen(false);
          toast("Posted to Huddle", "success");
        };

        const saveDraft = () => {
          if (!text.trim()) return;
          if (editingDraftId) {
            patch(prev => ({ ...prev, posts: prev.posts.map(p => p.id === editingDraftId ? { ...p, content: text.trim() } : p) }));
          } else {
            patch(prev => ({ ...prev, posts: [...prev.posts, { id: uid("p"), teamId: team.id, authorId: prev.currentUserId, content: text.trim(), createdAt: Date.now(), status: "draft", likes: [], comments: [] }] }));
          }
          setText(""); setComposerOpen(false); setEditingDraftId(null);
          toast("Draft saved", "success");
        };

        const publishDraft = (draft) => {
          patch(prev => ({ ...prev, posts: prev.posts.map(p => p.id === draft.id ? { ...p, status: "published", createdAt: Date.now() } : p) }));
          toast("Published to feed", "success");
        };
        const deleteDraft = (id) => patch(prev => ({ ...prev, posts: prev.posts.filter(p => p.id !== id) }));

        return (
          <div className="max-w-2xl mx-auto sm:p-6 pb-4">
            <div className="flex items-center justify-between px-4 sm:px-0 py-3 sm:py-0 sm:mb-4">
              <h1 className="text-xl font-bold">Huddle</h1>
              <div className="inline-flex rounded-full bg-gray-100 dark:bg-gray-800 p-1">
                <button onClick={() => setView("feed")} className={`px-3 py-1 rounded-full text-xs font-medium ${view === "feed" ? "bg-white dark:bg-gray-700 shadow-sm" : "text-gray-500"}`}>Feed</button>
                <button onClick={() => setView("drafts")} className={`px-3 py-1 rounded-full text-xs font-medium ${view === "drafts" ? "bg-white dark:bg-gray-700 shadow-sm" : "text-gray-500"}`}>Drafts {myDrafts.length > 0 && `(${myDrafts.length})`}</button>
              </div>
            </div>

            {view === "feed" && (
              <>
                <div className="bg-white dark:bg-gray-900 sm:rounded-xl border-y sm:border border-gray-100 dark:border-gray-800 mb-3 mx-0 sm:mx-0">
                  {!composerOpen ? (
                    <div className="flex items-center gap-3 px-4 py-3 cursor-pointer" onClick={() => { setComposerOpen(true); setEditingDraftId(null); }}>
                      <Avatar user={derived.currentUser} />
                      <div className="flex-1 bg-gray-100 dark:bg-gray-800 rounded-full px-4 py-2.5 text-sm text-gray-400">Share an update...</div>
                    </div>
                  ) : (
                    <div className="px-4 py-3">
                      <div className="flex gap-3">
                        <Avatar user={derived.currentUser} />
                        <div className="flex-1">
                          <textarea autoFocus value={text} onChange={e => setText(e.target.value)} placeholder="What's on your mind?" rows={3}
                            className="w-full bg-white dark:bg-gray-800 border border-indigo-300 dark:border-indigo-600 rounded-xl px-3 py-2.5 text-sm outline-none resize-none leading-relaxed" />
                          <div className="flex items-center gap-2 mt-2 flex-wrap">
                            <button className="flex items-center gap-1.5 text-xs text-gray-500 border border-gray-200 dark:border-gray-700 px-3 py-1.5 rounded-full">📷 Photo</button>
                            <button className="flex items-center gap-1.5 text-xs text-gray-500 border border-gray-200 dark:border-gray-700 px-3 py-1.5 rounded-full">🎬 Video</button>
                            <button className="flex items-center gap-1.5 text-xs text-gray-500 border border-gray-200 dark:border-gray-700 px-3 py-1.5 rounded-full">🎫 Ticket</button>
                            <button onClick={() => { setComposerOpen(false); setText(""); setEditingDraftId(null); }} className="text-xs text-gray-400 ml-1">Cancel</button>
                            <Button size="sm" variant="secondary" onClick={saveDraft} disabled={!text.trim()}>Save draft</Button>
                            <Button size="sm" onClick={submitPost} disabled={!text.trim()} className="ml-auto">Post</Button>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="space-y-0 sm:space-y-3">
                  {feedPosts.length === 0 && <EmptyState title="No posts yet" sub="Be the first to share a plan or update." />}
                  {feedPosts.map(p => <PostCard key={p.id} post={p} />)}
                </div>
              </>
            )}

            {view === "drafts" && (
              <div className="px-4 sm:px-0 space-y-3">
                <Button size="sm" variant="secondary" onClick={() => { setComposerOpen(true); setEditingDraftId(null); setText(""); setView("feed"); }}>+ New draft</Button>
                {myDrafts.length === 0 && <EmptyState title="No drafts" sub="Drafts are private until you publish them." />}
                {myDrafts.map(d => (
                  <div key={d.id} className="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 p-4">
                    <div className="text-sm text-gray-700 dark:text-gray-200 mb-2">{renderRich(d.content)}</div>
                    <div className="flex gap-2 justify-end">
                      <Button size="sm" variant="outline" onClick={() => { setText(d.content); setEditingDraftId(d.id); setComposerOpen(true); setView("feed"); }}>Edit</Button>
                      <Button size="sm" variant="danger" onClick={() => deleteDraft(d.id)}>Delete</Button>
                      <Button size="sm" onClick={() => publishDraft(d)}>Publish</Button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      function PostCard({ post }) {
        const { state, patch } = useApp();
        const derived = useDerived();
        const author = derived.userById(post.authorId);
        const liked = post.likes.includes(state.currentUserId);
        const [showComments, setShowComments] = useState(false);
        const [commentText, setCommentText] = useState("");
        const ticket = post.ticketId ? state.tickets.find(t => t.id === post.ticketId) : null;

        const toggleLike = () => {
          patch(prev => ({ ...prev, posts: prev.posts.map(p => p.id === post.id ? { ...p, likes: liked ? p.likes.filter(u => u !== state.currentUserId) : [...p.likes, state.currentUserId] } : p) }));
        };
        const addComment = () => {
          if (!commentText.trim()) return;
          patch(prev => ({ ...prev, posts: prev.posts.map(p => p.id === post.id ? { ...p, comments: [...p.comments, { id: uid("c"), authorId: prev.currentUserId, content: commentText.trim(), createdAt: Date.now() }] } : p) }));
          setCommentText("");
        };
        const deletePost = () => patch(prev => ({ ...prev, posts: prev.posts.filter(p => p.id !== post.id) }));
        const [menuOpen, setMenuOpen] = useState(false);

        return (
          <div className="border-b sm:border sm:rounded-xl border-gray-100 dark:border-gray-800 px-4 sm:px-5 pt-4 pb-2 bg-white dark:bg-gray-900">
            <div className="flex items-center gap-3 mb-2">
              <Avatar user={author} />
              <div className="flex-1 min-w-0">
                <div className="text-sm font-semibold truncate">{author?.name}</div>
                <div className="text-[11px] text-gray-400">{timeAgo(post.createdAt)} ago</div>
              </div>
              {post.authorId === state.currentUserId && (
                <div className="relative">
                  <button onClick={() => setMenuOpen(v => !v)} className="w-8 h-8 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center text-gray-400">⋯</button>
                  {menuOpen && (
                    <div className="absolute right-0 top-9 bg-white dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-lg shadow-lg py-1 z-10 w-32">
                      <button onClick={() => { deletePost(); setMenuOpen(false); }} className="w-full text-left px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 dark:hover:bg-red-500/10">Delete post</button>
                    </div>
                  )}
                </div>
              )}
            </div>
            <div className="text-sm text-gray-800 dark:text-gray-100 leading-relaxed mb-2 whitespace-pre-wrap">{renderRich(post.content)}</div>
            {ticket && <div className="mb-2"><span className="inline-flex items-center gap-1.5 text-xs bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-2.5 py-1.5"><SourceBadge source={ticket.source} />{ticket.title}</span></div>}
            <div className="flex items-center gap-4 py-2 border-t border-gray-50 dark:border-gray-800 text-sm text-gray-500">
              <button onClick={toggleLike} className={`flex items-center gap-1.5 ${liked ? "text-red-500" : ""}`}>{liked ? "❤️" : "🤍"} {post.likes.length}</button>
              <button onClick={() => setShowComments(v => !v)} className="flex items-center gap-1.5">💬 {post.comments.length}</button>
              <button className="flex items-center gap-1.5 ml-auto">↗ Share</button>
            </div>
            {showComments && (
              <div className="pb-3 space-y-2">
                {post.comments.map(c => (
                  <div key={c.id} className="flex gap-2 text-sm">
                    <Avatar user={derived.userById(c.authorId)} size="sm" />
                    <div className="bg-gray-50 dark:bg-gray-800 rounded-2xl px-3 py-1.5 flex-1">
                      <div className="text-xs font-semibold">{derived.userById(c.authorId)?.name}</div>
                      <div className="text-gray-700 dark:text-gray-200">{c.content}</div>
                    </div>
                  </div>
                ))}
                <div className="flex gap-2 items-center pt-1">
                  <Avatar user={derived.currentUser} size="sm" />
                  <input value={commentText} onChange={e => setCommentText(e.target.value)} onKeyDown={e => e.key === "Enter" && addComment()} placeholder="Write a comment..."
                    className="flex-1 bg-gray-100 dark:bg-gray-800 rounded-full px-3 py-1.5 text-sm outline-none" />
                </div>
              </div>
            )}
          </div>
        );
      }

      /* ============================== TICKETS ============================== */

      function Tickets() {
        const { state, patch, toast } = useApp();
        const derived = useDerived();
        const team = derived.currentTeam;
        const [statusFilter, setStatusFilter] = useState("all");
        const [sourceFilter, setSourceFilter] = useState("all");
        const [assigneeFilter, setAssigneeFilter] = useState("all");
        const [search, setSearch] = useState("");
        const [createOpen, setCreateOpen] = useState(false);
        const [detailTicket, setDetailTicket] = useState(null);
        const [syncing, setSyncing] = useState(null);

        if (!team) return <EmptyState title="No team selected" />;
        let list = state.tickets.filter(t => t.teamId === team.id);
        if (statusFilter !== "all") list = list.filter(t => t.status === statusFilter);
        if (sourceFilter !== "all") list = list.filter(t => t.source === sourceFilter);
        if (assigneeFilter === "me") list = list.filter(t => t.assigneeId === state.currentUserId);
        if (search.trim()) list = list.filter(t => t.title.toLowerCase().includes(search.toLowerCase()));
        list = list.sort((a, b) => b.createdAt - a.createdAt);

        const syncFrom = (source) => {
          setSyncing(source);
          setTimeout(() => {
            const n = 1 + Math.floor(Math.random() * 2);
            const newOnes = [...Array(n)].map((_, i) => ({
              id: uid("tk"), teamId: team.id,
              title: source === "github" ? `Synced issue: refactor module ${Math.floor(Math.random() * 900)}` : `Synced ticket: support case ${Math.floor(Math.random() * 900)}`,
              status: "open", assigneeId: state.currentUserId, source, ref: source === "github" ? `#${400 + Math.floor(Math.random() * 200)}` : `RM-${1000 + Math.floor(Math.random() * 300)}`,
              priority: "medium", createdAt: Date.now(), loggedMs: 0,
            }));
            patch(prev => ({ ...prev, tickets: [...prev.tickets, ...newOnes] }));
            toast(`Synced ${n} issue${n > 1 ? "s" : ""} from ${source === "github" ? "GitHub" : "Redmine"}`, "success");
            setSyncing(null);
          }, 900);
        };

        return (
          <div className="max-w-4xl mx-auto p-4 sm:p-6 space-y-4">
            <div className="flex items-center justify-between">
              <h1 className="text-xl font-bold">Tickets</h1>
              <Button size="sm" onClick={() => setCreateOpen(true)}>+ New ticket</Button>
            </div>

            <div className="flex gap-2 flex-wrap">
              <Button size="sm" variant="outline" disabled={syncing === "github"} onClick={() => syncFrom("github")}>{syncing === "github" ? "Syncing…" : "🐙 Sync GitHub"}</Button>
              <Button size="sm" variant="outline" disabled={syncing === "redmine"} onClick={() => syncFrom("redmine")}>{syncing === "redmine" ? "Syncing…" : "◆ Sync Redmine"}</Button>
            </div>

            <div className="bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 p-3 flex flex-wrap gap-2 items-center">
              <TextInput value={search} onChange={e => setSearch(e.target.value)} placeholder="Search tickets..." className="flex-1 min-w-[140px]" />
              <Select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="w-auto" options={[{ value: "all", label: "All statuses" }, { value: "open", label: "Open" }, { value: "in_progress", label: "In Progress" }, { value: "done", label: "Done" }]} />
              <Select value={sourceFilter} onChange={e => setSourceFilter(e.target.value)} className="w-auto" options={[{ value: "all", label: "All sources" }, { value: "github", label: "GitHub" }, { value: "redmine", label: "Redmine" }, { value: "local", label: "Local" }]} />
              <Select value={assigneeFilter} onChange={e => setAssigneeFilter(e.target.value)} className="w-auto" options={[{ value: "all", label: "Everyone" }, { value: "me", label: "Assigned to me" }]} />
            </div>

            <div className="space-y-2">
              {list.length === 0 && <EmptyState title="No tickets match" sub="Try clearing filters or create a new ticket." />}
              {list.map(t => (
                <button key={t.id} onClick={() => setDetailTicket(t)} className="w-full text-left bg-white dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-800 p-4 hover:border-indigo-200 dark:hover:border-indigo-700 transition-colors">
                  <div className="flex items-start justify-between gap-3">
                    <div className="min-w-0">
                      <div className="font-medium text-gray-900 dark:text-gray-100 truncate">{t.title}</div>
                      <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                        <SourceBadge source={t.source} />
                        <StatusBadge status={t.status} />
                        {t.ref && <span className="text-[11px] text-gray-400">{t.ref}</span>}
                        {t.loggedMs > 0 && <span className="text-[11px] text-gray-400">⏱ {fmtDuration(t.loggedMs)} logged</span>}
                      </div>
                    </div>
                    <Avatar user={derived.userById(t.assigneeId)} size="sm" />
                  </div>
                </button>
              ))}
            </div>

            <CreateTicketModal open={createOpen} onClose={() => setCreateOpen(false)} teamId={team.id} />
            {detailTicket && <TicketDetailModal ticket={state.tickets.find(t => t.id === detailTicket.id) || detailTicket} onClose={() => setDetailTicket(null)} />}
          </div>
        );
      }

      function CreateTicketModal({ open, onClose, teamId }) {
        const { state, patch, toast } = useApp();
        const derived = useDerived();
        const team = state.teams.find(t => t.id === teamId);
        const [title, setTitle] = useState("");
        const [assignee, setAssignee] = useState(state.currentUserId);
        const [priority, setPriority] = useState("medium");

        const create = () => {
          if (!title.trim()) return;
          patch(prev => ({ ...prev, tickets: [...prev.tickets, { id: uid("tk"), teamId, title: title.trim(), status: "open", assigneeId: assignee, source: "local", ref: null, priority, createdAt: Date.now(), loggedMs: 0 }] }));
          toast("Ticket created", "success");
          setTitle(""); onClose();
        };

        return (
          <Modal open={open} onClose={onClose} title="New ticket" footer={<><Button variant="outline" onClick={onClose}>Cancel</Button><Button onClick={create} disabled={!title.trim()}>Create</Button></>}>
            <Field label="Title"><TextInput autoFocus value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. Fix pagination bug" /></Field>
            <Field label="Assignee">
              <Select value={assignee} onChange={e => setAssignee(e.target.value)} options={(team?.members || []).map(m => { const u = state.users.find(x => x.id === m.userId); return { value: m.userId, label: u?.name || m.userId }; })} />
            </Field>
            <Field label="Priority"><Select value={priority} onChange={e => setPriority(e.target.value)} options={[{ value: "low", label: "Low" }, { value: "medium", label: "Medium" }, { value: "high", label: "High" }]} /></Field>
          </Modal>
        );
      }

      function TicketDetailModal({ ticket, onClose }) {
        const { state, patch, toast } = useApp();
        const derived = useDerived();
        const team = state.teams.find(t => t.id === ticket.teamId);
        const [title, setTitle] = useState(ticket.title);
        const [confirmDelete, setConfirmDelete] = useState(false);
        const linkedPosts = state.posts.filter(p => p.ticketId === ticket.id && p.status === "published");
        const linkedSessions = state.clockEvents.filter(ce => ce.ticketId === ticket.id && ce.endAt);

        useEffect(() => setTitle(ticket.title), [ticket.id]);

        const save = (patchObj) => { patch(prev => ({ ...prev, tickets: prev.tickets.map(t => t.id === ticket.id ? { ...t, ...patchObj } : t) })); };
        const saveTitle = () => { if (title.trim() && title !== ticket.title) { save({ title: title.trim() }); toast("Ticket updated", "success"); } };
        const remove = () => { patch(prev => ({ ...prev, tickets: prev.tickets.filter(t => t.id !== ticket.id) })); toast("Ticket deleted", "success"); onClose(); };

        return (
          <Modal open={!!ticket} onClose={onClose} title="Ticket details" wide
            footer={<><Button variant="danger" onClick={() => setConfirmDelete(true)}>Delete</Button><Button onClick={onClose}>Done</Button></>}>
            <div className="space-y-3">
              <Field label="Title"><TextInput value={title} onChange={e => setTitle(e.target.value)} onBlur={saveTitle} onKeyDown={e => e.key === "Enter" && e.target.blur()} /></Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Status"><Select value={ticket.status} onChange={e => save({ status: e.target.value })} options={[{ value: "open", label: "Open" }, { value: "in_progress", label: "In Progress" }, { value: "done", label: "Done" }]} /></Field>
                <Field label="Assignee">
                  <Select value={ticket.assigneeId} onChange={e => save({ assigneeId: e.target.value })} options={(team?.members || []).map(m => { const u = state.users.find(x => x.id === m.userId); return { value: m.userId, label: u?.name || m.userId }; })} />
                </Field>
              </div>
              <div className="flex items-center gap-2 flex-wrap"><SourceBadge source={ticket.source} />{ticket.ref && <Badge tone="gray">{ticket.ref}</Badge>}<Badge tone="gray">⏱ {fmtDuration(ticket.loggedMs || 0)} logged</Badge></div>

              <div>
                <div className="text-xs font-semibold text-gray-500 mb-1.5">Time sessions</div>
                {linkedSessions.length === 0 && <div className="text-xs text-gray-400">No sessions logged on this ticket yet.</div>}
                {linkedSessions.map(ce => (
                  <div key={ce.id} className="flex justify-between text-xs py-1 border-b border-gray-50 dark:border-gray-800">
                    <span>{new Date(ce.startAt).toLocaleDateString()}</span><span>{fmtDuration(ce.endAt - ce.startAt)}</span>
                  </div>
                ))}
              </div>

              <div>
                <div className="text-xs font-semibold text-gray-500 mb-1.5">Linked huddle posts</div>
                {linkedPosts.length === 0 && <div className="text-xs text-gray-400">No posts linked.</div>}
                {linkedPosts.map(p => (
                  <div key={p.id} className="text-xs py-1.5 border-b border-gray-50 dark:border-gray-800">
                    <span className="font-medium">{derived.userById(p.authorId)?.name}: </span>{renderRich(p.content.slice(0, 100))}
                  </div>
                ))}
              </div>
            </div>
            <ConfirmModal open={confirmDelete} onClose={() => setConfirmDelete(false)} onConfirm={remove} title="Delete ticket" message={`Delete "${ticket.title}"? This can't be undone.`} />
          </Modal>
        );
      }

      /* ============================== TEAMS ============================== */

      function Teams() {
        const { state, patch, toast } = useApp();
        const derived = useDerived();
        const [openTeamId, setOpenTeamId] = useState(derived.currentTeam?.id);
        const team = state.teams.find(t => t.id === openTeamId) || derived.currentTeam;

        return (
          <div className="max-w-3xl mx-auto p-4 sm:p-6 space-y-4">
            <h1 className="text-xl font-bold">Teams</h1>
            <div className="flex gap-2 overflow-x-auto scrollbar-none pb-1">
              {derived.orgTeams.map(t => (
                <button key={t.id} onClick={() => setOpenTeamId(t.id)} className={`shrink-0 px-4 py-2 rounded-full text-sm font-medium border ${t.id === team?.id ? "bg-indigo-600 text-white border-indigo-600" : "bg-white dark:bg-gray-900 border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300"}`}>
                  {t.name}
                </button>
              ))}
            </div>
            {team && <TeamDetail team={team} />}
          </div>
        );
      }

      function TeamDetail({ team }) {
        const { state, patch, toast } = useApp();
        const derived = useDerived();
        const membership = team.members.find(m => m.userId === state.currentUserId);
        const canManage = membership && (membership.role === "owner" || membership.role === "admin");
        const isOwnerOfTeam = membership && membership.role === "owner";
        const [name, setName] = useState(team.name);
        const [confirmDeleteTeam, setConfirmDeleteTeam] = useState(false);
        const [confirmRemove, setConfirmRemove] = useState(null);
        const [addMemberOpen, setAddMemberOpen] = useState(false);

        useEffect(() => setName(team.name), [team.id]);

        const rename = () => { if (name.trim() && name !== team.name) { patch(prev => ({ ...prev, teams: prev.teams.map(t => t.id === team.id ? { ...t, name: name.trim() } : t) })); toast("Team renamed", "success"); } };
        const setRole = (userId, role) => patch(prev => ({ ...prev, teams: prev.teams.map(t => t.id === team.id ? { ...t, members: t.members.map(m => m.userId === userId ? { ...m, role } : m) } : t) }));
        const removeMember = (userId) => { patch(prev => ({ ...prev, teams: prev.teams.map(t => t.id === team.id ? { ...t, members: t.members.filter(m => m.userId !== userId) } : t) })); toast("Member removed", "success"); };
        const toggleGate = () => patch(prev => ({ ...prev, teams: prev.teams.map(t => t.id === team.id ? { ...t, settings: { ...t.settings, requirePlanForClock: !t.settings.requirePlanForClock } } : t) }));
        const deleteTeam = () => {
          patch(prev => ({ ...prev, teams: prev.teams.filter(t => t.id !== team.id), currentTeamId: prev.teams.find(t => t.id !== team.id && t.orgId === team.orgId)?.id }));
          toast("Team deleted", "success");
        };
        const availableToAdd = state.users.filter(u => !team.members.some(m => m.userId === u.id));
        const addMember = (userId) => { patch(prev => ({ ...prev, teams: prev.teams.map(t => t.id === team.id ? { ...t, members: [...t.members, { userId, role: "member" }] } : t) })); toast("Member added", "success"); setAddMemberOpen(false); };

        return (
          <div className="space-y-4">
            <Card title="Team name" right={canManage ? <Badge tone="gray">Join code: {team.joinCode}</Badge> : null}>
              <div className="flex gap-2">
                <TextInput value={name} onChange={e => setName(e.target.value)} disabled={!canManage} onBlur={rename} onKeyDown={e => e.key === "Enter" && e.target.blur()} />
              </div>
              {!canManage && <div className="text-[11px] text-gray-400 mt-1">Only team admins/owner can rename.</div>}
            </Card>

            <Card title="Members" right={canManage ? <Button size="sm" variant="secondary" onClick={() => setAddMemberOpen(true)}>+ Add</Button> : null}>
              <div className="divide-y divide-gray-50 dark:divide-gray-800">
                {team.members.map(m => {
                  const u = derived.userById(m.userId);
                  return (
                    <div key={m.userId} className="flex items-center gap-3 py-2.5">
                      <Avatar user={u} size="sm" />
                      <div className="flex-1 min-w-0"><div className="text-sm font-medium truncate">{u?.name}{m.userId === state.currentUserId && " (you)"}</div></div>
                      {canManage && m.role !== "owner" ? (
                        <Select value={m.role} onChange={e => setRole(m.userId, e.target.value)} className="w-28" options={[{ value: "member", label: "Member" }, { value: "admin", label: "Admin" }]} />
                      ) : <RoleBadge role={m.role} />}
                      {canManage && m.role !== "owner" && <Button size="sm" variant="ghost" onClick={() => setConfirmRemove(m.userId)}>Remove</Button>}
                    </div>
                  );
                })}
              </div>
            </Card>

            <Card title="Team settings">
              <label className="flex items-center justify-between cursor-pointer">
                <div>
                  <div className="text-sm font-medium">Require a plan before clocking</div>
                  <div className="text-xs text-gray-400">Members must post a short plan before clock-in and a wrap-up before clock-out.</div>
                </div>
                <input type="checkbox" checked={!!team.settings?.requirePlanForClock} onChange={toggleGate} disabled={!canManage} className="w-5 h-5 accent-indigo-600" />
              </label>
            </Card>

            {isOwnerOfTeam && (
              <Card title="Danger zone">
                <div className="flex items-center justify-between">
                  <div className="text-sm text-gray-500">Deleting a team removes all its tickets and posts.</div>
                  <Button variant="danger" size="sm" onClick={() => setConfirmDeleteTeam(true)}>Delete team</Button>
                </div>
              </Card>
            )}

            <ConfirmModal open={confirmDeleteTeam} onClose={() => setConfirmDeleteTeam(false)} onConfirm={deleteTeam} title="Delete team" message={`Delete "${team.name}"? All tickets and posts in this team will be removed.`} />
            <ConfirmModal open={!!confirmRemove} onClose={() => setConfirmRemove(null)} onConfirm={() => removeMember(confirmRemove)} title="Remove member" message="Remove this member from the team?" confirmLabel="Remove" />
            <Modal open={addMemberOpen} onClose={() => setAddMemberOpen(false)} title="Add member to team">
              <div className="space-y-1">
                {availableToAdd.length === 0 && <div className="text-xs text-gray-400">No more users to add.</div>}
                {availableToAdd.map(u => (
                  <button key={u.id} onClick={() => addMember(u.id)} className="w-full flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800">
                    <Avatar user={u} size="sm" /><span className="text-sm">{u.name}</span>
                  </button>
                ))}
              </div>
            </Modal>
          </div>
        );
      }

      /* ============================== ORGANIZATION SETTINGS ============================== */

      function OrgSettings() {
        const { state, patch, toast } = useApp();
        const derived = useDerived();
        const org = derived.currentOrg;
        const [name, setName] = useState(org?.name || "");
        const [confirmDeleteOrg, setConfirmDeleteOrg] = useState(false);
        const [newOrgOpen, setNewOrgOpen] = useState(false);
        const [inviteOpen, setInviteOpen] = useState(false);

        useEffect(() => setName(org?.name || ""), [org?.id]);
        if (!org) return <EmptyState title="No organization" />;

        const orgMemberIds = Array.from(new Set(derived.orgTeams.flatMap(t => t.members.map(m => m.userId))));
        const rename = () => { if (name.trim() && name !== org.name) { patch(prev => ({ ...prev, orgs: prev.orgs.map(o => o.id === org.id ? { ...o, name: name.trim() } : o) })); toast("Organization renamed", "success"); } };
        const deleteOrg = () => {
          patch(prev => {
            const remaining = prev.orgs.filter(o => o.id !== org.id);
            const nextOrg = remaining[0];
            return { ...prev, orgs: remaining, teams: prev.teams.filter(t => t.orgId !== org.id), currentOrgId: nextOrg?.id, currentTeamId: prev.teams.find(t => t.orgId === nextOrg?.id)?.id };
          });
          toast("Organization deleted", "success");
        };

        return (
          <div className="max-w-3xl mx-auto p-4 sm:p-6 space-y-4">
            <div className="flex items-center justify-between">
              <h1 className="text-xl font-bold">Organization</h1>
              <Button size="sm" variant="secondary" onClick={() => setNewOrgOpen(true)}>+ New organization</Button>
            </div>

            <Card title="Organization name">
              <TextInput value={name} onChange={e => setName(e.target.value)} disabled={!derived.isOwner} onBlur={rename} onKeyDown={e => e.key === "Enter" && e.target.blur()} />
              {!derived.isOwner && <div className="text-[11px] text-gray-400 mt-1">Only the owner can rename the organization.</div>}
            </Card>

            <Card title={`Teams (${derived.orgTeams.length})`}>
              <div className="space-y-1.5">
                {derived.orgTeams.map(t => (
                  <div key={t.id} className="flex items-center justify-between text-sm px-3 py-2 rounded-lg bg-gray-50 dark:bg-gray-800">
                    <span>{t.name}</span><span className="text-xs text-gray-400">{t.members.length} members</span>
                  </div>
                ))}
              </div>
            </Card>

            <Card title={`Members (${orgMemberIds.length})`} right={<Button size="sm" variant="secondary" onClick={() => setInviteOpen(true)}>+ Invite</Button>}>
              <div className="divide-y divide-gray-50 dark:divide-gray-800">
                {orgMemberIds.map(uid_ => {
                  const u = derived.userById(uid_);
                  return (
                    <div key={uid_} className="flex items-center gap-3 py-2">
                      <Avatar user={u} size="sm" />
                      <span className="text-sm flex-1">{u?.name}</span>
                      {org.ownerId === uid_ && <Badge tone="purple">Owner</Badge>}
                    </div>
                  );
                })}
              </div>
            </Card>

            {derived.isOwner && (
              <Card title="Danger zone">
                <div className="flex items-center justify-between">
                  <div className="text-sm text-gray-500">Deleting the organization removes all its teams, tickets, and posts.</div>
                  <Button variant="danger" size="sm" onClick={() => setConfirmDeleteOrg(true)}>Delete organization</Button>
                </div>
              </Card>
            )}

            <ConfirmModal open={confirmDeleteOrg} onClose={() => setConfirmDeleteOrg(false)} onConfirm={deleteOrg} title="Delete organization" message={`Delete "${org.name}"? This removes all teams inside it.`} />
            <NewOrgModal open={newOrgOpen} onClose={() => setNewOrgOpen(false)} />
            <InviteModal open={inviteOpen} onClose={() => setInviteOpen(false)} />
          </div>
        );
      }

      function NewOrgModal({ open, onClose }) {
        const { patch, toast } = useApp();
        const [name, setName] = useState("");
        const create = () => {
          if (!name.trim()) return;
          const orgId = uid("org"); const teamId = uid("team");
          patch(prev => ({
            ...prev,
            orgs: [...prev.orgs, { id: orgId, name: name.trim(), ownerId: prev.currentUserId }],
            teams: [...prev.teams, { id: teamId, orgId, name: "General", members: [{ userId: prev.currentUserId, role: "owner" }], settings: { requirePlanForClock: false }, joinCode: uid("code").slice(-8).toUpperCase() }],
            currentOrgId: orgId, currentTeamId: teamId,
          }));
          toast("Organization created", "success"); setName(""); onClose();
        };
        return (
          <Modal open={open} onClose={onClose} title="New organization" footer={<><Button variant="outline" onClick={onClose}>Cancel</Button><Button onClick={create} disabled={!name.trim()}>Create</Button></>}>
            <Field label="Organization name"><TextInput autoFocus value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Northwind Inc." /></Field>
          </Modal>
        );
      }

      function InviteModal({ open, onClose }) {
        const { patch, toast } = useApp();
        const [name, setName] = useState("");
        const invite = () => {
          if (!name.trim()) return;
          const id = uid("u");
          patch(prev => ({ ...prev, users: [...prev.users, { id, name: name.trim(), avatarColor: colorForName(name) }] }));
          toast(`Invited ${name.trim()}`, "success"); setName(""); onClose();
        };
        return (
          <Modal open={open} onClose={onClose} title="Invite a member" footer={<><Button variant="outline" onClick={onClose}>Cancel</Button><Button onClick={invite} disabled={!name.trim()}>Send invite</Button></>}>
            <Field label="Name or email"><TextInput autoFocus value={name} onChange={e => setName(e.target.value)} placeholder="e.g. jamie@company.com" /></Field>
            <p className="text-xs text-gray-400">Demo: this adds them straight to your org's user directory (no email is sent).</p>
          </Modal>
        );
      }

      /* ============================== PROFILE ============================== */

      function ProfilePage() {
        const { state, patch, resetDemo, toast } = useApp();
        const derived = useDerived();

        return (
          <div className="max-w-lg mx-auto p-4 sm:p-6 space-y-4">
            <h1 className="text-xl font-bold">Profile</h1>
            <Card title="Account">
              <div className="flex items-center gap-3 mb-3"><Avatar user={derived.currentUser} size="lg" /><div><div className="font-semibold">{derived.currentUser?.name}</div><RoleBadge role={derived.role} /></div></div>
              <div className="text-xs font-semibold text-gray-500 mb-1.5">Switch demo user (to preview roles)</div>
              <div className="space-y-1">
                {state.users.map(u => (
                  <button key={u.id} onClick={() => patch(prev => ({ ...prev, currentUserId: u.id }))}
                    className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-left ${u.id === state.currentUserId ? "bg-indigo-50 dark:bg-indigo-500/10" : "hover:bg-gray-50 dark:hover:bg-gray-800"}`}>
                    <Avatar user={u} size="sm" /><span className="text-sm">{u.name}</span>
                  </button>
                ))}
              </div>
            </Card>
            <Card title="Appearance">
              <div className="flex items-center justify-between">
                <span className="text-sm">Dark mode</span>
                <input type="checkbox" checked={state.theme === "dark"} onChange={() => patch(prev => ({ ...prev, theme: prev.theme === "dark" ? "light" : "dark" }))} className="w-5 h-5 accent-indigo-600" />
              </div>
            </Card>
            <Card title="Demo data">
              <p className="text-xs text-gray-400 mb-2">This prototype stores its state in your browser only. Reset to restore the original seed data.</p>
              <Button variant="outline" size="sm" onClick={() => { resetDemo(); toast("Demo data reset", "success"); }}>Reset demo data</Button>
            </Card>
          </div>
        );
      }

      /* ============================== ROOT ============================== */

      function Root() {
        return <AppProvider><App /></AppProvider>;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
    </script>
    <script>
      (function () {
        const src = document.getElementById('app-src').textContent;
        const output = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
        const script = document.createElement('script');
        script.textContent = output;
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
